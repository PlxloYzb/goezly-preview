<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>goezly 原型</title>
<style>
:root{--bg:#EEF2EC;--card:#FBFCFA;--ink:#1B2A29;--ink2:#54635F;--line:#D2DAD0;--alert:#B8402E}
@media (prefers-color-scheme: dark){:root{--bg:#111917;--card:#18221F;--ink:#E4EBE6;--ink2:#A3B1AC;--line:#2E3C39;--alert:#E5705F}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Noto Sans SC",system-ui,sans-serif}
form{width:100%;max-width:340px;padding:28px 22px;border:1px solid var(--line);border-radius:20px;background:var(--card)}
h1{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
p{margin:0 0 18px;color:var(--ink2);font-size:14px}
input[type=password]{width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:16px;outline:none}
input[type=password]:focus{border-color:var(--ink)}
label.keep{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:14px;color:var(--ink2)}
label.keep input{width:18px;height:18px}
button{width:100%;height:48px;border:0;border-radius:12px;background:var(--ink);color:var(--card);font-size:16px;font-weight:600}
button:disabled{opacity:.6}
.err{min-height:20px;margin:10px 0 0;color:var(--alert);font-size:13.5px}
</style>
</head>
<body>
<form id="f" autocomplete="off" style="visibility:hidden">
  <h1>goezly 原型</h1>
  <p>内部预览，请输入访问密码。</p>
  <input id="pw" type="password" placeholder="访问密码" aria-label="访问密码" autocomplete="current-password">
  <label class="keep"><input id="keep" type="checkbox" checked>在这台设备上记住</label>
  <button id="go">打开</button>
  <div class="err" id="err" role="alert"></div>
</form>

const K = 'goezly-key-' + P.salt;   // 换密码后 salt 会变，旧的记忆自动失效
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const decrypt = async key => new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:u8(P.iv) }, key, u8(P.data)));
function show(html){ document.open(); document.write(html); document.close(); }
async function fromSaved(){
  try { const raw = localStorage.getItem(K); if (!raw) return false;
    show(await decrypt(await crypto.subtle.importKey('raw', u8(raw), 'AES-GCM', false, ['decrypt']))); return true;
  } catch (e) { try { localStorage.removeItem(K); } catch (_) {} return false; }
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = '正在打开…'; err.textContent = '';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:u8(P.salt), iterations:P.iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, true, ['decrypt']);
    const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
    const html = await decrypt(key);   // 密码错误会在这里失败
    if (document.getElementById('keep').checked) { try { localStorage.setItem(K, btoa(String.fromCharCode(...raw))); } catch (_) {} }
    show(html);
  } catch (e2) {
    btn.disabled = false; btn.textContent = '打开'; err.textContent = '密码不对，请再试一次。';
  }
});
if (!window.crypto || !crypto.subtle){ document.getElementById('f').style.visibility = 'visible'; document.getElementById('err').textContent = '当前浏览器不支持，请用 Safari 打开。'; }
// 页面加载完后再读记住的密钥（加载中调用 document.open 会叠加而不是替换页面）
else window.addEventListener('load', async () => { if (!(await fromSaved())) document.getElementById('f').style.visibility = 'visible'; });
</script>
